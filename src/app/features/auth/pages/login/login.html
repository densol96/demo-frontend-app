<section class="login">
  <h1>Sign in</h1>
  <p>Select a user to continue:</p>

  <select [(ngModel)]="selectedUserId">
    <option value="">-- choose a user --</option>
    @for (user of loadedUsers | async; track user.id) {
    <option [value]="user.id">{{ user.username }} ({{ user.role }})</option>
    }
  </select>

  <button [disabled]="!selectedUserId()" (click)="login()">Sign in</button>
</section>
