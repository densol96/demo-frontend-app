<h3>{{ title() }}</h3>

<form [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Product Name<span class="req">*</span>
    <input type="text" formControlName="name" placeholder="Enter product name" />
  </label>
  <app-form-error [fc]="f.name" />

  <label>
    Description
    <textarea formControlName="description" rows="3" placeholder="Optional description"></textarea>
  </label>
  <app-form-error [fc]="f.description" />

  <label>
    Price<span class="req">*</span>
    <input type="number" formControlName="price" placeholder="0.00" min="0" step="0.01" />
  </label>
  <app-form-error [fc]="f.price" />

  <label>
    Stock<span class="req">*</span>
    <input type="number" formControlName="stock" placeholder="0" min="0" />
  </label>
  <app-form-error [fc]="f.stock" />

  <div class="actions">
    <button type="button" class="cancel" (click)="onCancel()">Cancel</button>
    <button type="submit" [disabled]="form.invalid" class="save">Save</button>
  </div>
</form>
