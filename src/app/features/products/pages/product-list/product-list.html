<router-outlet />
<section class="product-list">
  <a
    *appAuth="'EMPLOYEE'"
    routerLink="add"
    class="product-list__btn product-list__btn--create"
    title="Add new product"
  >
    ➕ Add Product
  </a>
  @if (loading()) {
  <div class="product-list__loading">
    <p>Loading products...</p>
  </div>
  } @else if (error()) {
  <div class="product-list__error">
    <p>{{ error() }}</p>
    <button (click)="loadProducts(true)">Try again</button>
  </div>
  } @else { @if (productsPerPage().length > 0) {
  <app-sort-control [selectedField]="sortBy()" [selectedOrder]="sortOrder()" [fields]="fields" />
  <div class="product-list__grid">
    @for (product of productsPerPage(); track product.id) {
    <app-product-card [product]="product"></app-product-card>
    }
  </div>
  <app-pagination [totalPages]="totalPages()" [currentPage]="page()"></app-pagination>
  } @else {
  <p class="product-list__empty">No products available.</p>
  } }
</section>
