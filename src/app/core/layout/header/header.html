<header class="header">
  <div class="header__inner">
    <app-logo class="header__logo" />

    <nav class="header__nav">
      <a routerLink="/products" routerLinkActive="active">Products</a>
      <a *appAuth="'CUSTOMER'" routerLink="/cart" routerLinkActive="active">Cart</a>
      <a *appAuth="'CUSTOMER'" routerLink="/orders" routerLinkActive="active">Orders</a>
      <p *appAuth>{{ (loggedInUser | async)?.username }}</p>
      <div *appAuth="'AUTHENTICATED'; notLoggedInTml: loginTpl">
        <button class="logout-btn" (click)="logout()">Logout</button>
        <p class="timer">{{ secondsRemainingInSession | async | timeFormat }}</p>
      </div>
      <ng-template #loginTpl>
        <a routerLink="/login" routerLinkActive="active">Login</a>
      </ng-template>
    </nav>
  </div>
</header>
